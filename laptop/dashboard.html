<!doctype html><meta charset="utf-8"><title>Turret</title>
<style>
:root{--bg:#10141a;--panel:#1a212b;--fg:#e6edf3;--mut:#8b98a8;--ok:#3fb950;--bad:#f85149;--acc:#58a6ff}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;padding:16px}
.wrap{display:flex;gap:16px;flex-wrap:wrap;max-width:1100px;margin:auto}
.video{flex:1 1 640px}
img{width:100%;border-radius:8px;background:#000;display:block;aspect-ratio:4/3;cursor:crosshair}
.side{flex:1 1 220px;display:grid;gap:10px;align-content:start}
.card{background:var(--panel);border-radius:8px;padding:12px}
.k{color:var(--mut);font-size:12px}.v{font:600 22px ui-monospace,monospace}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-weight:600;background:#30363d}
button{background:var(--acc);color:#04121f;border:0;border-radius:6px;padding:8px 12px;font-weight:600;cursor:pointer;margin:2px 4px 2px 0}
button.off{background:#30363d;color:var(--fg)}
.err{color:var(--bad);font-size:12px;margin-top:6px}
</style>
<div class="wrap">
 <div class="video"><img id="v" alt="camera"><div class="k" style="margin-top:6px">Click the target (e.g. the white bottle) to lock its color.</div></div>
 <div class="side">
  <div class="card"><span id="st" class="badge">connecting…</span>
   <div style="margin-top:8px"><button id="trk" class="off" onclick="toggle()">Tracking: OFF</button><button class="off" onclick="post('/clear')">Clear target</button>
   <div class="k" style="margin-top:8px">Track a color</div><button class="off" onclick="post('/preset?name=teal')">Teal</button><button class="off" onclick="post('/preset?name=neon%20blue')">Neon blue</button></div>
   <div id="err" class="err"></div></div>
  <div class="card"><div class="k">FPS</div><div class="v" id="fps">–</div>
   <div class="k">Gimbal (pan / tilt)</div><div class="v" id="ang">–</div></div>
  <div class="card"><div class="k">Picture orientation</div>
   <button id="vm" onclick="toggleView('mirror')">Mirror</button>
   <button id="vv" class="off" onclick="toggleView('vflip')">Flip vertical</button>
   <button id="vk" class="off" onclick="toggleView('mask')">Show color match</button></div>
  <div class="card"><div class="k">Lead: aim ahead of a moving target</div>
   <input id="lead" type="range" min="0" max="800" step="25" value="250" style="width:100%"
    oninput="$('leadv').textContent=this.value+' ms'" onchange="post('/cfg?lead_ms='+this.value)">
   <div class="v" id="leadv">250 ms</div></div>
  <div class="card"><div class="k">Aiming mode</div>
   <button id="mmap" onclick="setMode('map')">Map (camera fixed)</button>
   <button id="mfol" class="off" onclick="setMode('follow')">Follow (camera on gimbal)</button></div>
  <div class="card"><div class="k">Wrong direction? Flip an axis</div>
   <button class="off" onclick="post('/flip?axis=pan')">Flip pan <span id="sp"></span></button>
   <button class="off" onclick="post('/flip?axis=tilt')">Flip tilt <span id="stl"></span></button>
   <button class="off" onclick="post('/center')">Center</button></div>
 </div>
</div>
<script>
const $=i=>document.getElementById(i),v=$('v');
let boot=null,tracking=false;
let seq=-1,shown=null;
async function pump(){   // one request per frame: nothing long-lived that can freeze
 try{const r=await fetch('/frame.jpg?after='+seq,{cache:'no-store'});
  if(r.status===200){seq=+r.headers.get('X-Seq');const url=URL.createObjectURL(await r.blob());
   const old=shown;shown=url;v.src=url;if(old)URL.revokeObjectURL(old)}
 }catch(e){await new Promise(t=>setTimeout(t,500))}
 pump()}
pump();
const reconnect=()=>{seq=-1};
v.onclick=async e=>{const r=v.getBoundingClientRect();
 const res=await post(`/select?x=${(e.clientX-r.left)/r.width*v.naturalWidth}&y=${(e.clientY-r.top)/r.height*v.naturalHeight}`);
 $('err').textContent=res.ok===false?'Click directly on the bottle (that spot is a wall or too big).':''};
const post=u=>fetch(u,{method:'POST'}).then(r=>r.json());
async function toggle(){const r=await post('/track?on='+(tracking?0:1));$('err').textContent=r.error||''}
let viewState={mirror:true,vflip:false,mask:false};
async function toggleView(k){await post('/view?key='+k+'&on='+(viewState[k]?0:1))}
async function setMode(m){await post('/mode?name='+m)}
const sgn=x=>x>0?'(+)':'(−)';
async function tick(){try{const s=await (await fetch('/state')).json();
 if(boot!==null&&s.boot!==boot)reconnect();boot=s.boot;
 $('fps').textContent=s.fps;tracking=s.tracking;
 $('ang').textContent=s.angles?s.angles.join(' / '):'–';
 $('trk').textContent='Tracking: '+(s.tracking?'ON':'OFF');$('trk').className=s.tracking?'':'off';
 $('mmap').className=s.mode==='map'?'':'off';$('mfol').className=s.mode==='follow'?'':'off';
 if(s.view){viewState=s.view;$('vm').className=s.view.mirror?'':'off';$('vv').className=s.view.vflip?'':'off';$('vk').className=s.view.mask?'':'off'}
 if(s.cfg&&document.activeElement!==$('lead')){$('lead').value=s.cfg.lead_ms;$('leadv').textContent=s.cfg.lead_ms+' ms'}
 if(s.sign){$('sp').textContent=sgn(s.sign.pan);$('stl').textContent=sgn(s.sign.tilt)}
 $('err').textContent=s.error||'';
 const st=$('st');st.textContent=!s.connected?'No camera':!s.armed?'LIVE: click a target':s.target?(s.tracking?'TRACKING':'LOCKED (gimbal off)'):'Target lost';
 st.style.background=s.target?'var(--ok)':s.connected?'#30363d':'var(--bad)';st.style.color=s.target?'#04120a':'#fff';
 }catch(e){}setTimeout(tick,200)}tick();
</script>
