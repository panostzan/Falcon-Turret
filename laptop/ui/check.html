<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turret system check</title>
<link rel="stylesheet" href="/ui.css">
<style>
  .check { flex: 1; min-height: 0; display: grid; place-items: start center; padding-top: 4vh; overflow: auto; }
  .box { width: min(760px, 100%); display: flex; flex-direction: column; gap: 14px; }
  .go { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .go button { font: 400 16px var(--font); padding: 14px 26px; cursor: pointer; border: 0;
               background: var(--teal); color: var(--teal-ink); }
  .go button:disabled { opacity: .5; cursor: progress; }
  .go label { font-size: 13px; color: var(--dim); display: flex; gap: 8px; align-items: center; cursor: pointer; }
  .overall { padding: 14px 18px; background: var(--panel); border: 1px solid var(--line); }
  .overall .big { font: 400 24px/1.1 var(--font); }
  .overall small { display: block; margin-top: 4px; color: var(--dim); font-size: 13px; }
.overall.pass .big { color: var(--ok); }
.overall.warn .big { color: var(--warn); }
.overall.fail .big { color: var(--alarm); }
  ul.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  ul.rows li { display: grid; grid-template-columns: 22px 190px 1fr; gap: 10px; align-items: start; padding: 10px 14px; background: var(--panel);
               border: 1px solid var(--line); }
  ul.rows .dot { width: 14px; height: 14px; margin-top: 3px; background: var(--dim); }
  ul.rows li.pass .dot { background: var(--ok); } ul.rows li.warn .dot { background: var(--warn); } ul.rows li.fail .dot { background: var(--alarm); }
  ul.rows li.skip .dot { background: transparent; border: 2px solid var(--dim); }
  ul.rows b { font-size: 14px; }
  ul.rows .d { font-size: 13px; line-height: 1.35; }
  ul.rows li.fail .d { color: var(--alarm); } ul.rows li.warn .d { color: var(--warn); } ul.rows li.skip .d { color: var(--dim); }
  ul.rows .fix { display: block; color: var(--teal); font-size: 13px; margin-top: 3px; }
  .hint { font-size: 13px; color: var(--dim); }
  @media (max-width: 700px) { ul.rows li { grid-template-columns: 22px 1fr; } ul.rows li .d { grid-column: 2; } }
</style>

<header class="top">
  <div class="brand">Turret</div>
  <nav class="tabs"><a href="/">Live</a><a href="/diagnostics">Diagnostics</a><a href="/qnx">QNX</a><a href="/check" aria-current="page">Check</a><a href="/servos">Servos</a></nav>
  <div class="status"><span id="st-video">Connecting…</span><span id="st-gimbal"></span><span id="st-depth"></span><span id="st-qnx"></span></div>
</header>

<main class="check">
  <div class="box">
    <div class="go">
      <button id="run">Run system check</button>
      <label><input type="checkbox" id="wiggle"> Actuate servos (pan 6°, tilt 4°, lift 6°; keep clear)</label>
    </div>
    <div class="overall" id="overall"><div class="big">Not run</div><small>7 checks, about 5 s (10 s with servo actuation). No actuation unless enabled.</small></div>
    <ul class="rows" id="rows"></ul>
    <p class="hint">Pass · Warning · Fault · Skipped</p>
  </div>
</main>

<script src="/ui.js"></script>
<script>
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const WORDS = { pass: 'Pass', warn: 'Warning', fail: 'Fault' };

async function run() {
  const btn = $('run'); btn.disabled = true; btn.textContent = 'Running…';
  $('overall').className = 'overall'; $('overall').innerHTML = '<div class="big">Running</div><small>Probing link, camera, tracker, interlock, servo driver, host</small>';
  try {
    const r = await (await fetch('/syscheck?wiggle=' + ($('wiggle').checked ? 1 : 0), { method: 'POST' })).json();
    const s = r.summary;
    $('overall').className = 'overall ' + s.verdict;
    $('overall').innerHTML = `<div class="big">${WORDS[s.verdict]}</div><small>${s.pass} pass, ${s.warn} warning, ${s.fail} fault, ${s.skip} skipped · ${r.seconds} s</small>`;
    $('rows').innerHTML = r.rows.map(x => `<li class="${x.state}"><span class="dot"></span><b>${esc(x.name)}</b><span class="d">${esc(x.detail)}${x.fix && x.state !== 'pass' ? `<span class="fix">${esc(x.fix)}</span>` : ''}</span></li>`).join('');
  } catch (e) {
    $('overall').className = 'overall fail'; $('overall').innerHTML = '<div class="big">No server</div><small>Dashboard server unreachable</small>';
  }
  btn.disabled = false; btn.textContent = 'Run again';
}
$('run').onclick = run;
poll('/state', 1000, setStatus);
</script>
