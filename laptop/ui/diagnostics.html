<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turret diagnostics</title>
<link rel="stylesheet" href="/ui.css">
<style>
  /* One verdict, one list of systems, the alerts, and two measurements. Space separates them; there are no panels. Green only
     means "operating"; amber is degraded, red is a mission-critical fault. */
  .diag { flex: 1; min-height: 0; display: grid; gap: 0 56px; grid-template-columns: minmax(300px, 0.8fr) minmax(0, 1.2fr); grid-template-rows: auto minmax(0, 1fr); }
  .diag h2 { margin: 0 0 14px; font-size: 13px; font-weight: 400; color: var(--dim); }
  .col { min-width: 0; min-height: 0; display: flex; flex-direction: column; }

  .verdict { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 20px; padding: 6px 0 26px; }
  .verdict .word { font: 600 32px/1 var(--font); white-space: nowrap; }
  .verdict .word::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 14px; border-radius: 50%; background: var(--dim); vertical-align: middle; }
  .verdict .line { font-size: 16px; color: var(--dim); min-width: 0; }
  .verdict.ok .word::before { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .verdict.warn .word { color: var(--warn); } .verdict.warn .word::before { background: var(--warn); }
  .verdict.bad .word { color: var(--alarm); } .verdict.bad .word::before { background: var(--alarm); }

  ul.sys { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
  ul.sys li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 0 4px; }
  ul.sys li::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--dim); opacity: .45; }
  ul.sys li.ok::before { background: var(--ok); opacity: 1; box-shadow: 0 0 6px var(--ok); }
  ul.sys li.warn::before { background: var(--warn); opacity: 1; } ul.sys li.bad::before { background: var(--alarm); opacity: 1; }
  ul.sys li.off::before { background: none; border: 1px solid var(--dim); opacity: .7; }
  ul.sys .nm { font-size: 15px; } ul.sys .nt { grid-column: 2; font-size: 12px; color: var(--dim); }
  ul.sys .vl { grid-column: 3; grid-row: 1 / span 2; font: 400 21px var(--font); text-align: right; white-space: nowrap; }
  ul.sys li.warn .vl { color: var(--warn); } ul.sys li.bad .vl { color: var(--alarm); } ul.sys li.off .vl, ul.sys li.off .nm { color: var(--dim); }

  .alerts { list-style: none; margin: 0 0 30px; padding: 0; display: flex; flex-direction: column; gap: 9px; min-height: 40px; }
  .alerts li { display: grid; grid-template-columns: 22px minmax(0, 1fr); font-size: 14px; line-height: 1.4; }
  .alerts li::before { content: ""; width: 9px; height: 9px; margin-top: 6px; border-radius: 50%; background: var(--warn); }
  .alerts li.bad::before { background: var(--alarm); } .alerts li.bad b { color: var(--alarm); } .alerts li.warn b { color: var(--warn); }
  .alerts li.adv::before { background: none; border: 1px solid var(--dim); } .alerts li.adv b { color: var(--text); font-weight: 400; }
  .alerts .fx { display: block; color: var(--dim); font-size: 13px; }
  .alerts .none { color: var(--dim); } .alerts .none::before { display: none; }

  .meas { margin-bottom: 26px; }
  .meas .hd { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 13px; color: var(--dim); }
  .meas .hd b { font: 400 16px var(--font); color: var(--text); }
  .strip { position: relative; height: 96px; }
  .strip canvas { position: absolute; inset: 0; width: 100%; height: 100% !important; margin: 0 !important; background: none !important; border: 0 !important; }
  .ruler { display: flex; gap: 2px; height: 16px; margin-bottom: 8px; }
  .ruler i { flex: 0 0 9px; background: var(--c); } .ruler i.gap { flex-basis: 9px; background: none; border-bottom: 1px solid var(--line); }
  .parts { display: flex; flex-wrap: wrap; gap: 4px 22px; font-size: 13px; color: var(--dim); }
  .parts span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; background: var(--c); }
  .parts b { color: var(--text); font-weight: 400; }

  .events { margin-top: auto; padding-top: 18px; font-size: 13px; color: var(--dim); display: flex; flex-direction: column; gap: 3px; }
  .events div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .events span { display: inline-block; width: 70px; }
  @media (max-width: 1000px) { html, body { height: auto; } .diag { grid-template-columns: 1fr; grid-template-rows: none; } .verdict { flex-wrap: wrap; } }
</style>

<header class="top">
  <div class="brand">Turret</div>
  <nav class="tabs"><a href="/">Live</a><a href="/diagnostics" aria-current="page">Diagnostics</a><a href="/qnx">QNX</a><a href="/check">Check</a></nav>
  <div class="status"><span id="st-video">Connecting…</span><span id="st-gimbal"></span><span id="st-depth"></span><span id="st-qnx"></span></div>
</header>

<main class="diag">
  <section class="verdict" id="verdict"><div class="word" id="v-title">Checking</div><div class="line" id="v-sub"></div></section>

  <div class="col">
    <h2>Systems</h2>
    <ul class="sys" id="sys"></ul>
    <div class="events" id="log"></div>
  </div>

  <div class="col">
    <h2>Alerts</h2>
    <ul class="alerts" id="alerts"></ul>
    <div class="meas">
      <div class="hd"><span>Picture interval</span><b id="gap-now">–</b></div>
      <div class="strip"><canvas id="c-gap"></canvas></div>
    </div>
    <div class="meas">
      <div class="hd"><span>Aiming latency</span><b id="lat-total">–</b></div>
      <div class="ruler" id="ruler"></div>
      <div class="parts" id="parts"></div>
    </div>
  </div>
</main>

<script src="/ui.js"></script>
<script>
let S = null, SYS = null, TEL = null;
const ms = v => (v == null ? '–' : (v >= 100 ? Math.round(v) : Number(v).toFixed(v < 10 ? 1 : 0)) + ' ms');
const TONES = ['#dfe6cf', '#a9b595', '#7b8668', '#566048'];     // the latency ruler's four parts, light to dark

/* Mission-critical parts (camera, tracker, control link, servo driver) decide the verdict. Everything else is an advisory.
   state: ok, warn (degraded), bad (fault), off (not in use). */
function assess() {
  const s = S;
  if (!s) return null;
  const q = s.qnx || {}, cam = s.camera || {}, rtt = q.rtt || {}, st = TEL ? TEL.stats : null;
  const udp = rtt.udp && rtt.udp.n ? rtt.udp : null, gap = st && st.interval_ms && st.interval_ms.n ? st.interval_ms : null;
  const onPi = s.source === 'Pi', noPic = !s.connected || s.frame_age > 2.5;
  const rows = [], alerts = [];
  const row = (name, state, value, note) => rows.push({ name, state, value, note });
  const alert = (sev, title, why, fix) => alerts.push({ sev, title, why, fix });

  // Camera
  if (noPic) {
    const gone = cam.state === 'stalled' && cam.usb === false;
    row('Camera', 'bad', gone ? 'not on USB' : 'no frames', onPi ? 'Pi' : s.source);
    alert('bad', gone ? 'Camera not detected on the Pi' : 'No frames arriving', gone ? '' : cam.state === 'stalled' ? 'The Pi sees the camera but receives nothing.' : `Nothing for ${Math.round(s.frame_age)} s.`,
      gone ? 'Replug the camera; check the Pi power supply.' : 'Check the camera cable, the hotspot and the Pi power.');
  } else if (s.fps < 10) {
    row('Camera', 'warn', `${s.fps} fps`, `${s.kb} KB/frame`);
    alert('warn', 'Low frame rate', `${s.fps} fps (nominal 15).`, 'Add light to the scene.');
  } else row('Camera', 'ok', `${s.fps} fps`, `${s.kb} KB/frame`);

  // Video link
  if (!onPi) row('Video link', 'off', 'n/a', s.source);
  else if (noPic) row('Video link', 'bad', 'down', '');
  else if (gap) {
    const bad = gap.p95 >= 500, warn = gap.p95 >= 150;
    row('Video link', bad ? 'bad' : warn ? 'warn' : 'ok', ms(gap.p50), `p95 ${ms(gap.p95)}`);
    if (warn) alert(bad ? 'bad' : 'warn', 'Video arrives in bursts', `p95 interval ${Math.round(gap.p95)} ms. Aiming is not affected.`, 'Move the laptop closer to the Pi, or use a separate 2.4 GHz network.');
  } else row('Video link', 'off', '…', '');

  // QNX tracker
  if (!onPi) row('QNX tracker', 'off', 'n/a', 'laptop webcam');
  else if (q.present && q.used) row('QNX tracker', 'ok', ms(q.proc_ms), `${q.state}${q.armed ? ', armed' : ''}`);
  else if (q.present && !s.armed) row('QNX tracker', 'ok', 'standby', 'no target set');
  else if (q.present && !s.view.qnx) row('QNX tracker', 'off', 'disabled', 'laptop tracker');
  else if (q.present) { row('QNX tracker', 'warn', 'stale', 'laptop tracker active'); alert('warn', 'QNX answers are stale', 'The laptop tracker has taken over.', 'Clears when the link recovers.'); }
  else { row('QNX tracker', 'bad', 'no reply', 'Pi'); alert('bad', 'QNX tracker not answering', 'The watchdog is not protecting the turret.', 'Check the Pi, then restart the dashboard.'); }

  // Control link
  if (!onPi || !q.present) row('Control link', 'off', onPi ? 'no QNX' : 'n/a', '');
  else if (!udp) { row('Control link', 'bad', 'no reply', 'UDP'); alert('bad', 'No UDP replies from the Pi', 'Control falls back to the video stream.', 'Allow Python through the Windows firewall (private networks).'); }
  else {
    const bad = udp.p95 >= 100, warn = udp.p95 >= 30;
    row('Control link', bad ? 'bad' : warn ? 'warn' : 'ok', ms(udp.p50), `p95 ${ms(udp.p95)}`);
    if (warn) alert(bad ? 'bad' : 'warn', 'Control link is slow', `p95 round trip ${Math.round(udp.p95)} ms.`, 'Check the Wi-Fi between the laptop and the Pi.');
  }
  if (q.present && q.link === false) alert('bad', 'Watchdog tripped: turret disarmed', 'The Pi stopped receiving heartbeats.', 'Restore the link, then arm again.');

  // Servo driver
  if (s.error && /gimbal/i.test(s.error)) { row('Servo driver', 'bad', 'error', ''); alert('bad', 'Servo driver not responding', s.error, 'Check the Feather USB cable and that nothing else holds the port.'); }
  else if (s.angles) row('Servo driver', 'ok', `Pan ${s.angles[0]}° · Tilt ${s.angles[1]}°`, 'connected');
  else row('Servo driver', 'off', 'idle', 'opens on Start tracking');

  // Depth network
  if (s.depth_error) { row('Depth network', 'warn', 'error', ''); alert('adv', 'Depth network failed to start', s.depth_error, ''); }
  else if (!s.view.depth && !s.view.depthcheck && !s.view.cutout) row('Depth network', 'off', 'off', '');
  else if (s.depth && s.depth.fps < 5) row('Depth network', 'warn', `${s.depth.fps} fps`, `${s.depth.ms} ms/frame`);
  else row('Depth network', 'ok', s.depth ? `${s.depth.fps} fps` : 'loading', s.depth ? `${s.depth.ms} ms/frame` : '');

  // Host
  const free = SYS ? SYS.ram_free_gb : null;
  if (free == null) row('Host', 'off', '…', '');
  else {
    row('Host', free < 1.0 ? 'warn' : 'ok', `${free} GB free`, `CPU ${SYS.cpu_process_pct}%`);
    if (free < 1.0) alert('adv', 'Laptop memory low', `${free} GB free.`, '');
  }

  const critical = ['Camera', 'QNX tracker', 'Control link', 'Servo driver'];
  const crit = rows.filter(r => r.state === 'bad' && critical.includes(r.name));
  const other = rows.filter(r => r.state === 'bad' || r.state === 'warn').filter(r => !crit.includes(r) && !(r.name === 'Host'));
  const order = { bad: 0, warn: 1, adv: 2 };
  alerts.sort((a, b) => order[a.sev] - order[b.sev]);
  const verdict = crit.length || alerts.some(a => a.sev === 'bad') ? { state: 'bad', title: 'Fault', sub: alerts.filter(a => a.sev === 'bad').map(a => a.title).slice(0, 2).join(' · ') }
    : other.length || alerts.some(a => a.sev === 'warn') ? { state: 'warn', title: 'Degraded', sub: alerts.filter(a => a.sev === 'warn').map(a => a.title).slice(0, 2).join(' · ') }
    : { state: 'ok', title: 'Operational', sub: alerts.length ? 'Advisory only' : '' };
  return { rows, alerts, verdict };
}

function latency() {
  const s = S, q = s.qnx || {}, rtt = q.rtt || {}, st = TEL ? TEL.stats : null, parts = [];
  if (q.used && q.proc_ms != null) parts.push(['Tracker', q.proc_ms]);
  if (rtt.udp && rtt.udp.n) parts.push(['Link', rtt.udp.p50]);
  if (st && st.proc_ms && st.proc_ms.n) parts.push(['Laptop', st.proc_ms.p50]);
  if (TEL && TEL.servo_rtt_ms != null) parts.push(['Servo', TEL.servo_rtt_ms]);
  return parts;
}

/* One tick per picture: its height is the time since the previous picture. Ticks past 150 ms turn amber. */
function drawStrip(canvas, values) {
  if (!canvas || !canvas.getContext) return;
  const dpr = window.devicePixelRatio || 1, W = canvas.clientWidth || 400, H = canvas.clientHeight || 90;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const g = canvas.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  const vals = (values || []).filter(v => v != null).slice(-Math.floor(W / 3));
  const max = Math.max(250, ...vals), y = v => H - 14 - (H - 18) * Math.min(1, v / max);
  g.font = '12px system-ui, "Segoe UI", sans-serif'; g.textBaseline = 'middle';
  g.setLineDash([2, 4]); g.strokeStyle = '#3a4528'; g.lineWidth = 1; g.beginPath(); g.moveTo(0, y(150)); g.lineTo(W, y(150)); g.stroke(); g.setLineDash([]);
  g.fillStyle = '#8b9777'; g.textAlign = 'right'; g.fillText('150 ms', W, y(150) - 8); g.textAlign = 'left';
  if (vals.length < 2) { g.fillText('waiting for frames', 0, H / 2); return; }
  vals.forEach((v, i) => {
    g.fillStyle = v > 150 ? '#ffb000' : '#a9b595';
    const step = W / vals.length, h = Math.max(2, H - 14 - y(v)); g.fillRect(i * step, H - 14 - h, Math.max(1.5, step * 0.5), h);
  });
  g.fillStyle = '#8b9777'; g.fillText('older', 0, H - 4); g.textAlign = 'right'; g.fillText('now', W, H - 4); g.textAlign = 'left';
}

function render() {
  const a = assess();
  if (!a) { $('v-title').textContent = 'No server'; $('v-sub').textContent = 'The dashboard server is not reachable.'; $('verdict').className = 'verdict bad'; return; }
  const s = S, st = TEL ? TEL.stats : null, gap = st && st.interval_ms && st.interval_ms.n ? st.interval_ms : null;
  $('verdict').className = 'verdict ' + a.verdict.state;
  $('v-title').textContent = a.verdict.title; $('v-sub').textContent = a.verdict.sub;
  $('sys').innerHTML = a.rows.map(r => `<li class="${r.state}"><span class="nm">${r.name}</span><span class="nt">${r.note || '&nbsp;'}</span><span class="vl">${r.value}</span></li>`).join('');
  const shown = a.alerts.slice(0, 4);
  $('alerts').innerHTML = shown.length
    ? shown.map(x => `<li class="${x.sev === 'adv' ? 'adv' : x.sev}"><span><b>${x.title}</b>${x.why ? ' ' + x.why : ''}${x.fix && x.sev !== 'adv' ? `<span class="fx">${x.fix}</span>` : ''}</span></li>`).join('') + (a.alerts.length > 4 ? `<li class="adv"><span>+${a.alerts.length - 4} more</span></li>` : '')
    : '<li class="none"><span>None</span></li>';
  $('gap-now').textContent = gap ? `${ms(gap.p50)} median · ${ms(gap.p95)} p95` : '–';
  const parts = latency(), total = parts.reduce((x, p) => x + p[1], 0);
  $('lat-total').textContent = parts.length ? ms(total) : '–';
  const cells = []; parts.forEach(([n, v], i) => { for (let k = 0; k < Math.max(1, Math.round(v * 2)); k++) cells.push(`<i style="--c:${TONES[i]}"></i>`); });
  $('ruler').innerHTML = cells.join('') || '<i class="gap"></i>';
  $('parts').innerHTML = parts.map(([n, v], i) => `<span style="--c:${TONES[i]}">${n} <b>${ms(v)}</b></span>`).join('');
  setStatus(s);
}

function renderTelemetry(t) {
  TEL = t;
  if (t) {
    drawStrip($('c-gap'), t.series.interval_ms);
    const qe = (S && S.qnx && S.qnx.events || []).map(([ago, text]) => [ago, text]);
    const all = t.events.concat(qe).sort((x, y) => x[0] - y[0]), seen = [], out = [];
    for (const [ago, text] of all) {            // the laptop and the Pi both log each QNX event: show it once
      const key = text.replace(/^QNX:\s*/, '');
      if (seen.some(([k, t0]) => k === key && Math.abs(t0 - ago) < 0.6)) continue;
      seen.push([key, ago]); out.push([ago, key]);
    }
    const fmt = ago => (ago < 90 ? Math.round(ago) + ' s' : Math.round(ago / 60) + ' min') + ' ago';
    $('log').innerHTML = out.slice(0, 3).map(([ago, text]) => `<div><span>${fmt(ago)}</span>${text}</div>`).join('');
  }
  render();
}

poll('/state', 500, s => { S = s; render(); });
poll('/system', 2000, x => { SYS = x; render(); });
poll('/telemetry', 1000, renderTelemetry);
window.addEventListener('resize', () => { if (TEL) drawStrip($('c-gap'), TEL.series.interval_ms); });
</script>
