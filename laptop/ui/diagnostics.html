<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turret diagnostics</title>
<link rel="stylesheet" href="/ui.css">
<style>
  /* Three questions, top to bottom and left to right: is it healthy (the banner), what is wrong (Needs attention), how fast is it (Speed).
     The system list is the one place every part is named with its state. Nothing is shown twice. */
  .diag { flex: 1; min-height: 0; display: grid; gap: 12px; grid-template-columns: minmax(340px, 0.9fr) minmax(0, 1.35fr); grid-template-rows: auto minmax(0, 1fr); }
  .diag .panel { min-width: 0; min-height: 0; overflow: hidden; padding: 14px 18px; display: flex; flex-direction: column; }
  .diag .panel > * { flex-shrink: 0; }
  .diag h2 { margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .diag h2 small { font: 400 13px var(--font); letter-spacing: 0; text-transform: none; color: var(--dim); }
  .col { display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
  .col .grow { flex: 1 1 0; min-height: 0; }
  .col .grow.scrolls { overflow-y: auto; }

  .banner { grid-column: 1 / -1; display: flex; align-items: center; gap: 22px; padding: 14px 20px; background: var(--panel); border: 1px solid var(--line); }
  .banner .word { font: 400 30px/1 var(--font); white-space: nowrap; }
  .banner .line { font-size: 16px; line-height: 1.35; color: var(--text); min-width: 0; }
.banner.ok .word { color: var(--ok); }
.banner.warn .word { color: var(--warn); }
.banner.bad .word { color: var(--alarm); }

  /* systems: one row per part */
  ul.systems { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; flex: 1; min-height: 0; justify-content: space-between; }
  ul.systems li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; padding: 5px 0 5px 14px; border-top: 1px solid var(--line);  }
  ul.systems li:first-child { border-top: 0; }
  ul.systems .nm { font: 400 16px var(--font); } ul.systems .nt { grid-column: 1; font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  ul.systems .vl { grid-row: 1 / span 2; grid-column: 2; font: 400 20px var(--mono); text-align: right; white-space: nowrap; }
  ul.systems li.warn .vl { color: var(--warn); } ul.systems li.bad .vl { color: var(--alarm); } ul.systems li.off .vl { color: var(--dim); font-size: 16px; } ul.systems li.off .nm { color: var(--dim); }

  /* needs attention */
  ol.issues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 150px; overflow: auto; }
  ol.issues li { padding: 10px 14px; background: var(--raise); }
  ol.issues b { display: block; font-size: 16px; } ol.issues li.bad b { color: var(--alarm); } ol.issues li.warn b { color: var(--warn); }
  ol.issues .why { display: block; font-size: 14px; margin-top: 3px; line-height: 1.4; }
  ol.issues .fix { display: block; font-size: 14px; margin-top: 4px; color: var(--teal); }
  .clear { padding: 4px 0; color: var(--ok); font: 400 16px var(--font); } .clear small { display: block; color: var(--dim); font: 400 14px var(--font); margin-top: 3px; }

  /* speed */
  .lead { font-size: 14px; line-height: 1.4; margin: 0 0 12px; padding: 10px 14px; background: var(--raise); }
  .lead b { color: var(--teal); font-weight: 400; }
  .sub-h { font-size: 13px; color: var(--dim); margin: 0 0 6px; display: flex; justify-content: space-between; gap: 10px; }
  .sub-h b { color: var(--text); font-weight: 400; text-align: right; }
  .gapbox { flex: 1; min-height: 120px; position: relative; margin-bottom: 12px; }
  .gapbox canvas { position: absolute; inset: 0; width: 100%; height: 100% !important; margin: 0 !important; }
  .budget { display: flex; height: 24px; background: #020301; border: 1px solid var(--line); }
  .budget i { display: block; height: 100%; min-width: 3px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; margin: 7px 0 12px; color: var(--dim); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 6px; background: var(--c); }
  .legend b { color: var(--text); font-weight: 400; font-family: var(--mono); }
  .cmp { display: grid; gap: 6px; font-size: 14px; margin-bottom: 4px; }
  .cmp div { display: grid; grid-template-columns: 100px minmax(0, 1fr) 245px; align-items: center; gap: 10px; }
  .cmp .track { height: 12px; background: #020301; border: 1px solid var(--line); } .cmp .track i { display: block; height: 100%; }
  .cmp .val { text-align: right; font: 13px var(--mono); white-space: nowrap; } .cmp .dim { color: var(--dim); }

  /* events and readings */
  .events { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 5px; font-size: 14px; }
  .events div { display: flex; gap: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .events span { color: var(--dim); font-family: var(--mono); font-size: 13px; width: 88px; flex: none; }
  details.more { margin-top: 10px; font-size: 14px; } details.more summary { cursor: pointer; color: var(--dim); }
  details.more table { width: 100%; margin-top: 6px; } details.more th { text-align: left; color: var(--dim); font-weight: 400; padding: 2px 0; } details.more td { text-align: right; font-family: var(--mono); font-size: 13px; }
  details.more td.na { color: var(--dim); }

  @media (max-width: 1000px) { html, body { height: auto; } .diag { grid-template-columns: 1fr; grid-template-rows: none; } .banner { flex-wrap: wrap; } .gapbox { min-height: 160px; } .cmp div { grid-template-columns: 90px 1fr; } .cmp .val { grid-column: 1 / -1; text-align: left; } }
</style>

<header class="top">
  <div class="brand">Turret</div>
  <nav class="tabs"><a href="/">Live</a><a href="/diagnostics" aria-current="page">Diagnostics</a><a href="/qnx">QNX</a><a href="/check">Check</a></nav>
  <div class="status"><span id="st-video">Connecting…</span><span id="st-gimbal"></span><span id="st-depth"></span><span id="st-qnx"></span></div>
</header>

<main class="diag">
  <section class="banner" id="banner"><div class="word" id="v-title">Checking…</div><div class="line" id="v-sub"></div></section>

  <div class="col">
    <section class="panel grow"><h2>Systems</h2><ul class="systems" id="systems"></ul></section>
    <section class="panel" style="height:150px"><h2>Events</h2><div class="events" id="log"></div></section>
  </div>

  <div class="col">
    <section class="panel"><h2>Alerts <small id="issue-count"></small></h2><ol class="issues" id="issues"></ol></section>
    <section class="panel grow scrolls">
      <h2>Timing</h2>
      <div class="sub-h">Frame interval <b id="gap-now">–</b></div>
      <div class="gapbox"><canvas id="c-gap"></canvas></div>
      <div class="sub-h">Aiming latency <b id="budget-total">–</b></div>
      <div class="budget" id="budget"></div>
      <div class="legend" id="budget-legend"></div>
      <div class="sub-h">Control round trip</div>
      <div class="cmp" id="cmp"></div>
      <details class="more"><summary>More readings</summary><table id="readings"></table></details>
    </section>
  </div>
</main>

<script src="/ui.js"></script>
<script>
let S = null, SYS = null, TEL = null;
const ms = v => (v == null ? '–' : (v >= 100 ? Math.round(v) : Number(v).toFixed(v < 10 ? 1 : 0)) + ' ms');

/* Readings to rows and alerts. state: ok, warn (degraded), bad (fault), off (not in use). Alerts are facts, not advice. */
function assess() {
  const s = S;
  if (!s) return null;
  const q = s.qnx || {}, cam = s.camera || {}, rtt = q.rtt || {}, st = TEL ? TEL.stats : null;
  const udp = rtt.udp && rtt.udp.n ? rtt.udp : null, gap = st && st.interval_ms && st.interval_ms.n ? st.interval_ms : null;
  const onPi = s.source === 'Pi', noPic = !s.connected || s.frame_age > 2.5;
  const tiles = [], issues = [];
  const tile = (name, state, value, sub) => tiles.push({ name, state, value, sub });
  const issue = (sev, title, why) => issues.push({ sev, title, why: why || '' });

  // Camera
  if (noPic) {
    const gone = cam.state === 'stalled' && cam.usb === false;
    tile('Camera', 'bad', gone ? 'not on USB' : 'no frames', onPi ? 'Pi' : s.source);
    issue('bad', gone ? 'Camera not on USB' : 'No frames', gone ? '' : `${Math.round(s.frame_age)} s since last frame`);
  } else if (s.fps < 10) {
    tile('Camera', 'warn', `${s.fps} fps`, `${s.kb} KB/frame`);
    issue('warn', 'Low frame rate', `${s.fps} fps`);
  } else tile('Camera', 'ok', `${s.fps} fps`, `${s.kb} KB/frame`);

  // Video link
  if (!onPi) tile('Video link', 'off', 'n/a', s.source);
  else if (noPic) tile('Video link', 'bad', 'down', '');
  else if (gap) {
    const bad = gap.p95 >= 500, warn = gap.p95 >= 150;
    tile('Video link', bad ? 'bad' : warn ? 'warn' : 'ok', ms(gap.p50), `p95 ${ms(gap.p95)}`);
    if (warn) issue(bad ? 'bad' : 'warn', 'Video link bursty', `p95 ${Math.round(gap.p95)} ms, max ${Math.round(gap.max)} ms`);
  } else tile('Video link', 'off', '…', '');

  // QNX tracker
  if (!onPi) tile('QNX tracker', 'off', 'n/a', 'laptop webcam');
  else if (q.present && q.used) tile('QNX tracker', 'ok', ms(q.proc_ms), `${q.state}${q.armed ? ', armed' : ''}`);
  else if (q.present && !s.armed) tile('QNX tracker', 'ok', 'standby', 'no target');
  else if (q.present && !s.view.qnx) tile('QNX tracker', 'off', 'disabled', '');
  else if (q.present) { tile('QNX tracker', 'warn', 'stale', 'laptop fallback'); issue('warn', 'QNX replies stale', 'laptop tracker active'); }
  else { tile('QNX tracker', 'bad', 'no reply', 'Pi'); issue('bad', 'QNX tracker not replying', 'watchdog inactive'); }

  // Control link
  if (!onPi || !q.present) tile('Control link', 'off', onPi ? 'no QNX' : 'n/a', '');
  else if (!udp) { tile('Control link', 'bad', 'no reply', 'UDP'); issue('bad', 'No UDP replies', 'control on video stream'); }
  else {
    const bad = udp.p95 >= 100, warn = udp.p95 >= 30;
    tile('Control link', bad ? 'bad' : warn ? 'warn' : 'ok', ms(udp.p50), `p95 ${ms(udp.p95)}`);
    if (warn) issue(bad ? 'bad' : 'warn', 'Control link slow', `p95 ${Math.round(udp.p95)} ms`);
  }
  if (q.present && q.link === false) issue('bad', 'Watchdog tripped', 'turret disarmed');

  // Servo driver
  if (s.error && /gimbal/i.test(s.error)) { tile('Servo driver', 'bad', 'error', ''); issue('bad', 'Servo driver error', s.error); }
  else if (s.angles) tile('Servo driver', 'ok', `Pan ${s.angles[0]}° · Tilt ${s.angles[1]}°`, '');
  else tile('Servo driver', 'off', 'idle', '');

  // Depth network
  if (s.depth_error) { tile('Depth network', 'bad', 'error', ''); issue('warn', 'Depth network error', s.depth_error); }
  else if (!s.view.depth && !s.view.depthcheck) tile('Depth network', 'off', 'off', '');
  else if (s.depth && s.depth.fps < 5) tile('Depth network', 'warn', `${s.depth.fps} fps`, `${s.depth.ms} ms/frame`);
  else tile('Depth network', 'ok', s.depth ? `${s.depth.fps} fps` : 'loading', s.depth ? `${s.depth.ms} ms/frame` : '');

  // Host
  const free = SYS ? SYS.ram_free_gb : null;
  if (free == null) tile('Host', 'off', '…', '');
  else {
    const bad = free < 1.0, warn = free < 1.6;
    tile('Host', bad ? 'bad' : warn ? 'warn' : 'ok', `${free} GB free`, `CPU ${SYS.cpu_process_pct}%`);
    if (warn) issue(bad ? 'bad' : 'warn', 'Host memory low', `${free} GB free`);
  }

  issues.sort((x, y) => (x.sev === 'bad' ? 0 : 1) - (y.sev === 'bad' ? 0 : 1));
  const bads = tiles.filter(t => t.state === 'bad').length, warns = tiles.filter(t => t.state === 'warn').length;
  const names = sev => issues.filter(i => i.sev === sev).map(i => i.title).slice(0, 2).join(' · ');
  const verdict = bads ? { state: 'bad', title: 'Fault', sub: names('bad') }
    : warns ? { state: 'warn', title: 'Degraded', sub: issues.map(i => i.title).slice(0, 2).join(' · ') }
    : { state: 'ok', title: 'Operational', sub: '' };
  return { tiles, issues, verdict };
}

function budget() {
  const s = S, q = s.qnx || {}, rtt = q.rtt || {}, st = TEL ? TEL.stats : null;
  const parts = [];
  if (q.used && q.proc_ms != null) parts.push(['QNX tracking', q.proc_ms, '#b6e23a']);
  if (rtt.udp && rtt.udp.n) parts.push(['Control link', rtt.udp.p50, '#ffb000']);
  if (st && st.proc_ms && st.proc_ms.n) parts.push(['Laptop processing', st.proc_ms.p50, '#8b9777']);
  if (TEL && TEL.servo_rtt_ms != null) parts.push(['Servo command', TEL.servo_rtt_ms, '#4fd6c4']);
  return parts;
}

/* The gap chart, with a scale in ms and the "slow" zone shaded (the page calls a video link slow when the slowest 5% of gaps pass 150 ms). */
function drawGap(canvas, values) {
  if (!canvas || !canvas.getContext) return;
  const dpr = window.devicePixelRatio || 1, W = canvas.clientWidth || 400, H = canvas.clientHeight || 110;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const g = canvas.getContext('2d'); g.scale(dpr, dpr); g.clearRect(0, 0, W, H);
  const vals = (values || []).filter(v => v != null);
  const padL = 52, top = 6, bottom = 4, max = Math.max(250, ...vals) * 1.08;
  const y = v => top + (H - top - bottom) * (1 - v / max);
  g.fillStyle = 'rgba(255,176,0,0.10)'; g.fillRect(padL, y(max), W - padL, y(150) - y(max));          // the slow zone
  g.font = '12px system-ui, "Segoe UI", sans-serif'; g.textBaseline = 'middle'; g.lineWidth = 1;
  for (const t of [0, 100, 200, 300, 400].filter(t => t <= max)) {
    g.strokeStyle = '#222b19'; g.beginPath(); g.moveTo(padL, y(t)); g.lineTo(W, y(t)); g.stroke();
    g.fillStyle = '#8b9777'; g.fillText(t + ' ms', 2, y(t));
  }
  g.fillStyle = '#ffb000'; g.textAlign = 'right'; g.fillText('slow', W - 6, y(150) - 9); g.textAlign = 'left';
  if (vals.length < 2) { g.fillStyle = '#8b9777'; g.fillText('waiting for pictures…', padL + 12, H / 2); return; }
  g.strokeStyle = '#b6e23a'; g.lineWidth = 1.8; g.beginPath();
  vals.forEach((v, i) => { const px = padL + (W - padL) * i / (vals.length - 1); i ? g.lineTo(px, y(v)) : g.moveTo(px, y(v)); });
  g.stroke();
}

const dot = s => s;
function render() {
  const a = assess();
  if (!a) { $('v-title').textContent = 'No server'; $('v-sub').textContent = 'No server'; $('banner').className = 'banner bad'; return; }
  const s = S, q = s.qnx || {}, st = TEL ? TEL.stats : null, rtt = q.rtt || {};
  const gap = st && st.interval_ms && st.interval_ms.n ? st.interval_ms : null;

  // 1. the banner
  $('banner').className = 'banner ' + a.verdict.state;
  $('v-title').textContent = a.verdict.title;
  $('v-sub').textContent = a.verdict.sub;

  // 2. systems, one row per part
  $('systems').innerHTML = a.tiles.map(t => `<li class="${t.state}"><span class="nm">${t.name}</span><span class="nt">${t.sub || '&nbsp;'}</span><span class="vl">${t.value}</span></li>`).join('');

  // 3. needs attention
  $('issue-count').textContent = a.issues.length ? `${a.issues.length} item${a.issues.length > 1 ? 's' : ''}` : '';
  $('issues').innerHTML = a.issues.length
    ? a.issues.map(i => `<li class="${i.sev}"><b>${i.title}</b>${i.why ? `<span class="why">${i.why}</span>` : ''}</li>`).join('')
    : '<div class="clear">None</div>';

  // 4. speed
  const parts = budget(), total = parts.reduce((x, p) => x + p[1], 0);
  $('gap-now').textContent = gap ? `p50 ${ms(gap.p50)} · p95 ${ms(gap.p95)}` : '–';
  $('budget-total').textContent = parts.length ? ms(total) : '–';
  $('budget').innerHTML = parts.map(([n, v, c]) => `<i title="${n}" style="width:${Math.max(1, v / total * 100)}%;background:${c}"></i>`).join('');
  $('budget-legend').innerHTML = parts.map(([n, v, c]) => `<span style="--c:${c}">${n} <b>${ms(v)}</b></span>`).join('') || '';
  const cmpMax = Math.max(1, (rtt.udp && rtt.udp.p95) || 0, (rtt.stream && rtt.stream.p95) || 0);
  const bar = (label, r, color) => r && r.n ? `<div><span>${label}</span><span class="track"><i style="width:${Math.max(2, r.p95 / cmpMax * 100)}%;background:${color}"></i></span><span class="val">p50 ${ms(r.p50)} · p95 ${ms(r.p95)}</span></div>` : `<div><span>${label}</span><span class="track"></span><span class="val dim">no data</span></div>`;
  $('cmp').innerHTML = bar('UDP', rtt.udp, '#b6e23a') + bar('Stream', rtt.stream, '#ffb000');

  const rd = (k, v, cls) => `<tr><th>${k}</th><td class="${cls || ''}">${v}</td></tr>`;
  const cam = s.camera || {};
  $('readings').innerHTML =
    rd('Video source', s.source || 'Pi') + rd('Picture size', s.connected ? `${s.kb} KB` : '–') + rd('Pictures dropped', s.dropped) +
    rd('Camera report', cam.state === 'ok' ? 'detected' : cam.state === 'stalled' ? (cam.usb === false ? 'not on USB' : 'silent') : 'none') +
    rd('Target colour', s.armed ? 'set' : 'not set') + rd('Confidence', s.confidence != null ? Math.round(s.confidence * 100) + '%' : '–') +
    rd('Mission (QNX)', q.present ? `${q.state}${q.armed ? ', ARMED' : ''}, shots ${q.shots}` : '–') +
    rd('Distance sensor', 'not connected', 'na') + rd('IR emitter / receiver', 'not connected', 'na') +
    (SYS ? rd('Uptime', Math.floor(SYS.uptime_s / 60) + ' min') + rd('Python', SYS.python) : '');
  setStatus(s);
}

function renderTelemetry(t) {
  TEL = t;
  if (t) {
    drawGap($('c-gap'), t.series.interval_ms);
    // each QNX event is also logged by the laptop a moment later: show it once
    const qe = (S && S.qnx && S.qnx.events || []).map(([ago, text]) => [ago, text]);
    const all = t.events.concat(qe).sort((a, b) => a[0] - b[0]);
    const seen = [], out = [];
    for (const [ago, text] of all) {
      const key = text.replace(/^QNX:\s*/, '');
      if (seen.some(([k, t0]) => k === key && Math.abs(t0 - ago) < 0.6)) continue;
      seen.push([key, ago]); out.push([ago, key]);
    }
    const fmt = ago => (ago < 90 ? Math.round(ago) + ' s' : Math.round(ago / 60) + ' min') + ' ago';
    $('log').innerHTML = out.length ? out.slice(0, 4).map(([ago, text]) => `<div><span>${fmt(ago)}</span>${text}</div>`).join('') : '';
  }
  render();
}

poll('/state', 500, s => { S = s; render(); });
poll('/system', 2000, x => { SYS = x; render(); });
poll('/telemetry', 1000, renderTelemetry);
window.addEventListener('resize', () => { if (TEL) drawGap($('c-gap'), TEL.series.interval_ms); });
</script>
